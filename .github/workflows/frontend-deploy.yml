name: Deploy Frontend to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'cinema-booking-frontend/**'
      - '.github/workflows/frontend-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy frontend on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/Cinema-Booking
            git pull origin main
            docker compose -f docker-compose.prod.yml build frontend || sudo docker compose -f docker-compose.prod.yml build frontend
            docker compose -f docker-compose.prod.yml up -d --no-deps frontend || sudo docker compose -f docker-compose.prod.yml up -d --no-deps frontend
            docker image prune -f || sudo docker image prune -f